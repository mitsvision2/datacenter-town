{% load staticfiles %}

<div id="step" style="display:none">{{step}}</div>
<div id="sim_code" style="display:none">{{sim_code}}</div>
<div id="map_mode" style="display:none">{{mode}}</div>
<div id="persona_name_list" style="display:none">{{persona_name_str}}</div>
<div id="persona_init_pos" style="display:none">
	{% for i in persona_init_pos %}
		<span>{{i.0}},{{i.1}},{{i.2}}</span>
	{% endfor %}
</div>

<script type="text/javascript">
	/*
	  Main resources: 
	  https://www.youtube.com/watch?v=cKIG1lKwLeo&t=401s&ab_channel=HongLy
	  For the ground zero code, see the exported files from here: 
	  https://codepen.io/mikewesthad/pen/BVeoYP?editors=1111 

	  Also worth taking a look: 
	  https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  and 
	  https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	 */


	// ###########################################################################
	// PREAMBLE
	// ###########################################################################

	// <step> -- one full loop around all three phases determined by <phase> is 
	// a step. We use this to link the steps in the backend. 
	let step = parseInt(document.getElementById('step').innerHTML);
	let sim_code = document.getElementById('sim_code').innerHTML;
	// let persona_names = document.getElementById('persona_name_list').innerHTML.split(",");

	let spans = document.getElementById('persona_init_pos').getElementsByTagName('span');
	let persona_names = {};
	for(var i = 0, l = spans.length; i < l; i++){
		let x = spans[i].innerText.split(",");
		persona_names[x[0]] = [parseInt(x[1]), parseInt(x[2])]
	}


	// Phaser 3.0 global settings. 
	// Configuration meant to be passed to the main Phaser game instance. 
	const config = {
	  type: Phaser.AUTO,
	  width: 1500,
	  height: 800,
	  parent: "game-container",
	  pixelArt: true,
	  physics: {
	    default: "arcade",
	    arcade: {
	      gravity: { y: 0 } } },
	  scene: {
	    preload: preload,
	    create: create,
	    update: update } };

	// const config = {
	//   type: Phaser.AUTO,
	//   width: 4480,
	//   height: 3200,
	//   parent: "game-container",
	//   pixelArt: true,
	//   physics: {
	//     default: "arcade",
	//     arcade: {
	//       gravity: { y: 0 } } },
	//   scene: {
	//     preload: preload,
	//     create: create,
	//     update: update },
	//   scale: {zoom: 0.5} };

	// ?overview=1: static whole-town view for the dashboard backdrop; never polls.
	const overview = new URLSearchParams(window.location.search).get("overview") === "1";
	// Replay only reads a saved run: no positions are posted back, and the dashboard can
	// pause it, change its speed (steps per tick) and seek; each step played is reported.
	const replayMode = document.getElementById("map_mode").innerHTML.trim() === "replay";
	const rp = {paused: false, stride: 1, seekTo: null, waitUntil: 0};
	function tellDashboard(msg) {
	  if (window.parent !== window) window.parent.postMessage(msg, window.location.origin);
	}

	// Creating the game instance and setting up the main Phaser variables that  
	// will be used in it. 
	const game = new Phaser.Game(config);
	let cursors;
	let player;
	let camera, mapW, mapH;
	let showDebug = false;

	// Persona related variables. This should have the name of the persona as its 
	// keys, and the instances of the Persona class as the values.
	var spawn_tile_loc = {};
	// for (var i = 0; i < persona_names.length; i++) { 
	// 	spawn_tile_loc[persona_names[i]] = [0, 0]
	// }

	for (var key in persona_names){
		spawn_tile_loc[key] = persona_names[key] ;
	}
	console.log(spawn_tile_loc);

	var personas = {};
	var pronunciatios = {};
	let anims_direction;
	let pre_anims_direction;
	let pre_anims_direction_dict = {};
	let pegs = {};   // persona name -> visible peg sprite
	// Pixel speech bubble: a bordered box with stepped corners, and a stepped
	// tail. The container's origin is the tail's tip, placed just above the peg's head.
	const BUB = 3;   // one art pixel, the same size as the pegs' pixels
	function speechBubble(scene, text) {
	  const label = scene.add.text(0, 0, text, {font: "bold 26px monospace", fill: "#000000"});
	  const gfx = scene.add.graphics();
	  const box = scene.add.container(0, 0, [gfx, label]).setDepth(3);
	  // align "left": the box reaches right from the tail; "right": it reaches left. lift raises the box
	  // with a stem down to the tail, for when the spot over the head is taken.
	  box.setText = (t, align = "left", lift = 0) => {
	    label.setText(t);
	    const u = BUB, w = Math.ceil(label.width / u) * u + 8 * u, h = Math.ceil(label.height / u) * u + 4 * u;
	    const tx = align === "right" ? w - 6 * u : 4 * u, tail = 4 * u;  // tail column and depth
	    const ox = -tx - u, oy = -(h + tail + lift);  // shift so the tail tip sits at (0, 0)
	    box.boxW = w; box.boxH = h;  // not .w: Phaser's Transform already uses it
	    gfx.clear().fillStyle(0x000000);
	    gfx.fillRect(ox + u, oy, w - 2 * u, h).fillRect(ox, oy + u, w, h - 2 * u);   // border, stepped corners
	    for (let i = 0; i < tail / u; i++) gfx.fillRect(ox + tx - u, oy + h - u + i * u, (tail / u - i + 1) * u, u);
	    gfx.fillStyle(0xffffff);
	    gfx.fillRect(ox + 2 * u, oy + u, w - 4 * u, h - 2 * u).fillRect(ox + u, oy + 2 * u, w - 2 * u, h - 4 * u);
	    for (let i = 0; i < tail / u - 1; i++) gfx.fillRect(ox + tx, oy + h - u + i * u, (tail / u - i - 1) * u, u);
	    if (lift) gfx.fillStyle(0x000000).fillRect(-2 * u, oy + h + tail - u, 2 * u, lift + u);
	    label.setPosition(ox + 4 * u, oy + 2 * u);
	    return box;
	  };
	  return box.setText(text);
	}
	// Tail tip just above the peg's head; the peg's feet sit on the tile's bottom edge.
	function placeBubble(name) {
	  const b = personas[name].body;
	  pronunciatios[name].setPosition(b.x + tile_width / 2 - 6, b.y + tile_width - 72 - 2)
	    .setDepth(3 + b.y * 1e-6);
	}
	const PEG_FACING = {d: 0, l: 1, r: 2, u: 3};
	const pegRow = (i, d) => (i % 8) * 4 + PEG_FACING[d || "d"];
	const pegIndex = (name) => Object.keys(spawn_tile_loc).indexOf(name);
	// Feet on the bottom edge of the persona's tile, centered on it.
	function syncPeg(name) {
	  const b = personas[name].body;
	  pegs[name].setPosition(b.x + tile_width / 2, b.y + tile_width)
	    .setDepth(2.5 + b.y * 1e-6);   // lower on the map draws in front
	}

	// Each agent's recent tiles, oldest first; the highlighted agent's are drawn as a trail.
	const TRAIL_MAX = 120;
	let tileTrail = {}, trailName = null, trailColor = 0x000000, trailGfx = null;
	function noteTile(name, x, y) {
	  const t = tileTrail[name] = tileTrail[name] || [], last = t[t.length - 1];
	  if (last && last[0] === x && last[1] === y) return;
	  // A jump breaks the trail rather than drawing a line through walls.
	  // A fast replay step covers several tiles; past what a trail can follow, it's left off.
	  const reach = replayMode && rp.stride <= 6 ? rp.stride + 1 : 2;
	  if (last && Math.abs(last[0] - x) + Math.abs(last[1] - y) > reach) t.length = 0;
	  t.push([x, y]);
	  if (t.length > TRAIL_MAX) t.shift();
	}
	// Older segments fade out; the newest ends at the tile they're walking to.
	function drawTrail() {
	  if (!trailGfx) return;
	  trailGfx.clear();
	  const t = trailName && tileTrail[trailName];
	  if (!t || t.length < 2) return;
	  const c = (p) => [p[0] * tile_width + tile_width / 2, p[1] * tile_width + tile_width / 2];
	  for (let i = 1; i < t.length; i++) {
	    const [ax, ay] = c(t[i - 1]), [bx, by] = c(t[i]);
	    trailGfx.lineStyle(8, trailColor, 0.15 + 0.65 * (i / (t.length - 1)));
	    trailGfx.lineBetween(ax, ay, bx, by);
	  }
	}

	// Night: a dark overlay following the game clock, warm indoors, with a soft light around each awake agent.
	// Built once from the tile map and only faded, so WebGL and canvas match. Keep in sync with dashboard.html's Day view (NIGHT_*, darkness()).
	const NIGHT_COLOR = 0x0b1236, NIGHT_WARM = 0xffb45c, NIGHT_MAX = 0.68;
	const NIGHT_INDOOR = 0.38, NIGHT_WARMTH = 0.22;  // indoors: share of the dark kept, and strength of the warm cast
	const night = {enabled: true, level: 0, target: 0, drawn: -1, dirty: true, hour: null, awake: {}, glows: {}};
	// The probe's night (opinion_probe.NIGHT_FROM / NIGHT_TO), with an hour's fade either side.
	const NIGHT_FROM = 22, NIGHT_TO = 6;
	function darkness(h) {
	  if (h == null) return 0;
	  if (h >= NIGHT_FROM || h < NIGHT_TO) return 1;
	  if (h >= NIGHT_FROM - 1) return h - (NIGHT_FROM - 1);
	  if (h < NIGHT_TO + 1) return 1 - (h - NIGHT_TO);
	  return 0;
	}
	function setNightTime(curr_time) {
	  const m = /(\d+):(\d+):\d+$/.exec(curr_time || "");
	  if (m) night.hour = +m[1] + +m[2] / 60;
	  night.target = night.enabled ? darkness(night.hour) * NIGHT_MAX : 0;
	}
	function drawNight() {
	  if (!night.out) return;
	  const k = night.level / NIGHT_MAX;  // 0 by day, 1 at full night
	  night.out.setAlpha(night.level).setVisible(night.level > 0.003);
	  night.inside.setAlpha(k).setVisible(night.level > 0.003);
	  // Agents: a light cool tint at night (WebGL only; the canvas renderer ignores tints).
	  const lerp = (a, b) => Math.round(a + (b - a) * k);
	  const tint = (lerp(255, 0xc4) << 16) | (lerp(255, 0xcc) << 8) | lerp(255, 0xe6);
	  for (const n of Object.keys(pegs)) pegs[n].setTint(tint);
	  for (const n of Object.keys(night.glows)) {
	    const g = night.glows[n], b = personas[n].body, on = night.awake[n] && night.level > 0.003;
	    g.setVisible(on);
	    if (on) g.setPosition(b.x + tile_width / 2, b.y + tile_width / 2).setAlpha(0.32 * k);
	  }
	  night.drawn = night.level;
	  night.dirty = false;
	}

	// Bubbles are short cues, never the text, which lives in the dashboard's readers.
	const SAY = {mark: 4500, activity: 2500};  // ms on screen
	const says = {};          // name -> {emoji, flash: {text, until}, mark: {text, until}}
	let marks = [], marksStep = null;  // logged reflections and whispers, from the dashboard
	const initialsOf = (n) => { const w = [...n.matchAll(/(\p{L})\p{L}+/gu)]; return ((w[0]?.[1] || "") + (w.length > 1 ? w[w.length - 1][1] : "")).toUpperCase(); };
	// Called once a step, when the step's movement arrives.
	function noteSays(move, at, prevStep) {
	  const now = performance.now();
	  for (const n of Object.keys(personas)) {
	    const p = move["persona"][n] || {}, s = says[n] = says[n] || {};
	    if (p["pronunciatio"] && p["pronunciatio"] !== s.emoji) {
	      if (s.emoji != null) s.flash = {text: `${initialsOf(n)}: ${p["pronunciatio"]}`, until: now + SAY.activity};
	      s.emoji = p["pronunciatio"];
	    }
	    s.talking = !!(p["chat"] && p["chat"].length);
	  }
	  // Reflections and whispers logged between the last step shown and this one.
	  for (const m of marks) {
	    if (m.step > at || (prevStep != null && m.step <= prevStep) || (prevStep == null && m.step !== at)) continue;
	    const s = says[m.agent] = says[m.agent] || {};
	    // A cue, not the text: what was thought or whispered is in the dashboard's readers.
	    s.mark = {text: `${initialsOf(m.agent)}: ${m.kind === "whisper" ? "◆ whisper" : "💭 reflecting"}`, until: now + SAY.mark};
	  }
	}
	// [text, rank]: rank only orders placement; lower ranks are placed first and keep the spot over their head.
	function sayFor(n, now) {
	  const s = says[n];
	  if (!s) return null;
	  if (s.mark && s.mark.until > now) return [s.mark.text, 0];
	  if (s.talking) return [`${initialsOf(n)}: 💬 talking`, 1];
	  if (s.flash && s.flash.until > now) return [s.flash.text, 3];
	  if (n === trailName && s.emoji) return [`${initialsOf(n)}: ${s.emoji}`, 2];
	  return null;
	}
	// Each bubble keeps last frame's side when it can (no flipping as agents move); it rises, with a stem,
	// only if both sides are taken. State uses say* names: Phaser containers already have .last and .w.
	function renderSays(now) {
	  const shown = [];
	  for (const n of Object.keys(pronunciatios)) {
	    const say = sayFor(n, now), b = pronunciatios[n];
	    if (!say) { b.setVisible(false); continue; }
	    if (b.sayText !== say[0]) { b.setText(say[0]); b.sayText = say[0]; b.sayLast = b.sayKey || b.sayLast; b.sayKey = null; }  // re-measures boxW/boxH
	    shown.push({b, text: say[0], rank: say[1]});
	  }
	  shown.sort((p, q) => p.rank - q.rank || p.b.x - q.b.x);
	  // Zoomed out, bubbles grow so they stay readable (at the whole-town view they'd be specks).
	  const sc = Math.max(1, 0.5 / camera.zoom);
	  const placed = [], u = BUB, tail = 4 * u, gap = u * sc;
	  for (const {b, text} of shown) {
	    b.setScale(sc);
	    const w = b.boxW, h = b.boxH, spot = (align, lift) => {
	      const x0 = b.x - ((align === "right" ? w - 6 * u : 4 * u) + u) * sc, y1 = b.y - (tail + lift) * sc;
	      return {align, lift, x0, x1: x0 + w * sc, y0: y1 - h * sc, y1};
	    };
	    const free = (r) => !placed.some((o) => r.x0 < o.x1 + gap && o.x0 < r.x1 + gap && r.y0 < o.y1 + gap && o.y0 < r.y1 + gap);
	    // Same side as last frame first, so free bubbles never swap sides; back down to head level as soon as there's room.
	    const [lastAlign = "left", lastLift = "0"] = (b.sayKey || b.sayLast || "").split("|");
	    const other = lastAlign === "left" ? "right" : "left", step = h + 2 * u;
	    const tries = [spot(lastAlign, 0), spot(other, 0), spot(lastAlign, +lastLift)];
	    for (let level = 1; level < 4; level++) tries.push(spot(lastAlign, level * step), spot(other, level * step));
	    const pick = tries.find(free) || spot(lastAlign, 0);
	    placed.push(pick);
	    const key = `${pick.align}|${pick.lift}`;
	    if (b.sayKey !== key) { b.setText(text, pick.align, pick.lift); b.sayKey = key; }
	    b.setVisible(true);
	  }
	}

	let curr_maze = "the_ville";

	// <tile_width> is the width of one individual tile (tiles are square)
	let tile_width = 32;
	// Important: tile_width % movement_speed has to be 0. 
	// <movement_speed> determines how fast we move at each upate cylce. 
	let movement_speed = 32; 

	// <timer_max> determines how frequently our update function will query the 
	// frontend server. If it's higher, we wait longer cycles. 
	let timer_max = 0;
	let timer = timer_max;

	// <phase> -- there are three phases: "process," "update," and "execute."
	let phase = "update"; // or "update" or "execute"

	// Variables for storing movements that are sent from the backend server.
	let execute_movement;
	let execute_count_max = tile_width/movement_speed;
	// Prevents overlapping update_environment requests.
	let update_pending = false;
	let execute_count = execute_count_max;
	let movement_target = {};
	// Whether each persona moves this step; set once per step so one that just arrived doesn't flash to standing.
	let step_moved = {};
	

	// ###########################################################################
	// ENGINE
	// ###########################################################################

	// Joon: Phaser 3.0 is oriented around "scenes" -- recall how Pokemon plays: 
	//       there is the outdoor space, and then there is the indoor space; when
	//       you go inside, you transition to a new "scene" and the outdoor space
	//       basically disappears. 
	//       A scene in Phaser has four key methods that are called at different
	//       stages of rendering for different purposes. They are: 
	//       init() -> preload() -> create() -> update()
	//         init() is called only once at the very beginning. This is the 
	//           initialization function in case that is needed. 
	//         preload() is called once and preloads any of the assets
	//         create() is also called once after preloading... creates sprites 
	//           and actually displays stuff
	//         update() is called on each frame during the game play 

	function preload() {  
	  // Loading the necessary images (e.g., the background image, character 
	  // sprites). 

	  // Joon: for load.image, the first parameter is simply the key value that
	  //       you are passing in. The second parameter should be pointed to the
	  //       png file that contains the tileset. 
	  //       Also IMPORTANT: when you create a tileset in Tiled, always be  
	  //       sure to check the "embedded" option. 
	  this.load.image("blocks_1", "{% static 'assets/the_ville/visuals/map_assets/blocks/blocks_1.png' %}");
	  this.load.image("walls", "{% static 'assets/the_ville/visuals/map_assets/v1/Room_Builder_32x32.png' %}");
	  this.load.image("interiors_pt1", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt1.png' %}");
	  this.load.image("interiors_pt2", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt2.png' %}");
	  this.load.image("interiors_pt3", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt3.png' %}");
	  this.load.image("interiors_pt4", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt4.png' %}");
	  this.load.image("interiors_pt5", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt5.png' %}");
	  this.load.image("CuteRPG_Field_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_B.png' %}");
	  this.load.image("CuteRPG_Field_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_C.png' %}");
	  this.load.image("CuteRPG_Harbor_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Harbor_C.png' %}");
	  this.load.image("CuteRPG_Village_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Village_B.png' %}");
	  this.load.image("CuteRPG_Forest_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_B.png' %}");
	  this.load.image("CuteRPG_Desert_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_C.png' %}");
	  this.load.image("CuteRPG_Mountains_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Mountains_B.png' %}");
	  this.load.image("CuteRPG_Desert_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_B.png' %}");
	  this.load.image("CuteRPG_Forest_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_C.png' %}");

	  // Joon: This is the export json file you get from Tiled. 
	  this.load.tilemapTiledJSON("map", "{% static 'assets/the_ville/visuals/the_ville_jan7.json' %}");

	  // An atlas is a way to pack multiple images together into one texture. I'm 
	  // using it to load all the player animations (walking left, walking right, 
	  // etc.) in one image. For more info see:
	  // https://labs.phaser.io/view.html?src=src/animation/texture%20atlas%20animation.js
	  // If you don't use an atlas, you can do the same thing with a spritesheet, 
	  // see: https://labs.phaser.io/view.html?src=src/animation/single%20sprite%20sheet.js
	  // Joon: Technically, I think this guy had the best tutorial for atlas: 
	  //       https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  // Peg sprites (tools/peg-sprite): 16x24 frames, 3 per row (stand, step, step),
  // rows = color index * 4 + facing (down, left, right, up).
  this.load.spritesheet("pegs", "{% static 'assets/flat/pegs.png' %}", {frameWidth: 16, frameHeight: 24});
  this.load.atlas("atlas", 
	                  "https://mikewesthad.github.io/phaser-3-tilemap-blog-posts/post-1/assets/atlas/atlas.png", 
	                  "https://mikewesthad.github.io/phaser-3-tilemap-blog-posts/post-1/assets/atlas/atlas.json");
	}

	function create() {  
	  const map = this.make.tilemap({ key: "map" });
	  // Joon: Logging map is really helpful for debugging here: 
	  //       console.log(map);

	  // The first parameter is the name you gave to the tileset in Tiled and then
	  // the key of the tileset image in Phaser's cache (i.e. the name you used in
	  // preload)
	  // Joon: for the first parameter here, really take a look at the 
	  //       console.log(map) output. You need to make sure that the name 
	  //       matches.
	  const collisions = map.addTilesetImage("blocks", "blocks_1");
	  const walls = map.addTilesetImage("Room_Builder_32x32", "walls");
	  const interiors_pt1 = map.addTilesetImage("interiors_pt1", "interiors_pt1");
	  const interiors_pt2 = map.addTilesetImage("interiors_pt2", "interiors_pt2");
	  const interiors_pt3 = map.addTilesetImage("interiors_pt3", "interiors_pt3");
	  const interiors_pt4 = map.addTilesetImage("interiors_pt4", "interiors_pt4");
	  const interiors_pt5 = map.addTilesetImage("interiors_pt5", "interiors_pt5");
	  const CuteRPG_Field_B = map.addTilesetImage("CuteRPG_Field_B", "CuteRPG_Field_B");
	  const CuteRPG_Field_C = map.addTilesetImage("CuteRPG_Field_C", "CuteRPG_Field_C");
	  const CuteRPG_Harbor_C = map.addTilesetImage("CuteRPG_Harbor_C", "CuteRPG_Harbor_C");
	  const CuteRPG_Village_B = map.addTilesetImage("CuteRPG_Village_B", "CuteRPG_Village_B");
	  const CuteRPG_Forest_B = map.addTilesetImage("CuteRPG_Forest_B", "CuteRPG_Forest_B");
	  const CuteRPG_Desert_C = map.addTilesetImage("CuteRPG_Desert_C", "CuteRPG_Desert_C");
	  const CuteRPG_Mountains_B = map.addTilesetImage("CuteRPG_Mountains_B", "CuteRPG_Mountains_B");
	  const CuteRPG_Desert_B = map.addTilesetImage("CuteRPG_Desert_B", "CuteRPG_Desert_B");
	  const CuteRPG_Forest_C = map.addTilesetImage("CuteRPG_Forest_C", "CuteRPG_Forest_C");

	  // The first parameter is the layer name (or index) taken from Tiled, the 
	  // second parameter is the tileset you set above, and the final two 
	  // parameters are the x, y coordinate. 
	  // Joon: The "layer name" that comes as the first parameter value  
	  //       literally is taken from our Tiled layer name. So to find out what
	  //       they are; you actually need to open up tiled and see how you 
	  //       named things there. 
	  let tileset_group_1 = [CuteRPG_Field_B, CuteRPG_Field_C, CuteRPG_Harbor_C, CuteRPG_Village_B, 
	  											 CuteRPG_Forest_B, CuteRPG_Desert_C, CuteRPG_Mountains_B, CuteRPG_Desert_B, CuteRPG_Forest_C,
	  											 interiors_pt1, interiors_pt2, interiors_pt3, interiors_pt4, interiors_pt5, walls];
	  const bottomGroundLayer = map.createLayer("Bottom Ground", tileset_group_1, 0, 0);
	  const exteriorGroundLayer = map.createLayer("Exterior Ground", tileset_group_1, 0, 0);
	  const exteriorDecorationL1Layer = map.createLayer("Exterior Decoration L1", tileset_group_1, 0, 0);
	  const exteriorDecorationL2Layer = map.createLayer("Exterior Decoration L2", tileset_group_1, 0, 0);
	  const interiorGroundLayer = map.createLayer("Interior Ground", tileset_group_1, 0, 0);
	  const wallLayer = map.createLayer("Wall", [CuteRPG_Field_C, walls], 0, 0);
	  const interiorFurnitureL1Layer = map.createLayer("Interior Furniture L1", tileset_group_1, 0, 0);
	  const interiorFurnitureL2Layer = map.createLayer("Interior Furniture L2 ", tileset_group_1, 0, 0);
	  const foregroundL1Layer = map.createLayer("Foreground L1", tileset_group_1, 0, 0);
	  const foregroundL2Layer = map.createLayer("Foreground L2", tileset_group_1, 0, 0);
	  foregroundL1Layer.setDepth(2);
	  foregroundL2Layer.setDepth(2);

	  const collisionsLayer = map.createLayer("Collisions", collisions, 0, 0);
	  // const groundLayer = map.createLayer("Ground", walls, 0, 0);
	  // const indoorGroundLayer = map.createLayer("Indoor Ground", walls, 0, 0);
	  // const wallsLayer = map.createLayer("Walls", walls, 0, 0);
	  // const interiorsLayer = map.createLayer("Furnitures", interiors, 0, 0);
	  // const builtInLayer = map.createLayer("Built-ins", interiors, 0, 0);
	  // const appliancesLayer = map.createLayer("Appliances", interiors, 0, 0);
	  // const foregroundLayer = map.createLayer("Foreground", interiors, 0, 0);

	  // Joon : This is where you want to create a custom field for the tileset
	  //        in Tiled. Take a look at this guy's tutorial: 
	  //        https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	  collisionsLayer.setCollisionByProperty({ collide: true });
	  // By default, everything gets depth sorted on the screen in the order we 
	  // created things. Here, we want the "Above Player" layer to sit on top of 
	  // the player, so we explicitly give it a depth. Higher depths will sit on 
	  // top of lower depth objects.
	  // Collisions layer should get a negative depth since we do not want to see
	  // it. 
	  collisionsLayer.setDepth(-1);
	  // foregroundL1Layer.setDepth(2);
	  // foregroundL1Layer.setDepth(2);

	  // *** SET UP CAMERA *** 
	  // "player" is to be set as the center of mass for our "camera." We 
	  // basically create a game character sprite as we would for our personas 
	  // but we move it to depth -1 and let it pass through the collision map;  
	  // that is, do not have the following line: 
	  // this.physics.add.collider(player, collisionsLayer);
	  // OLD NOTE: Create a sprite with physics enabled via the physics system. 
	  // The image  used for the sprite has a bit of whitespace, so I'm using 
	  // setSize & setOffset to control the size of the player's body.
	  player = this.physics.add.
	                sprite(800, 288, "atlas", "misa-front").
	                setSize(30, 40).
	                setOffset(0, 0);
	  player.setDepth(-1);
	  // Setting up the camera. 
	  camera = this.cameras.main;
	  mapW = map.widthInPixels;
	  mapH = map.heightInPixels;
	  camera.startFollow(player);
	  camera.setBounds(0, 0, mapW, mapH);
	  if (overview) {
	    camera.stopFollow();
	    camera.setZoom(Math.max(config.width / map.widthInPixels, config.height / map.heightInPixels));
	    camera.centerOn(map.widthInPixels / 2, map.heightInPixels / 2);
	  }
	  cursors = this.input.keyboard.createCursorKeys();

	  // *** SET UP PERSONAS *** 
	  // We start by creating the game sprite objects. 
	  for (let i=0; i<Object.keys(spawn_tile_loc).length; i++) { 
	    let persona_name = Object.keys(spawn_tile_loc)[i];
	    let start_pos = [spawn_tile_loc[persona_name][0] * tile_width + tile_width / 2, 
	                     spawn_tile_loc[persona_name][1] * tile_width + tile_width];
	    let new_sprite = this.physics.add
	                         .sprite(start_pos[0], start_pos[1], "atlas", "misa-front")
	                         .setSize(30, 40)
	                         .setOffset(0, 32); // DEBUG 1 --- I added 32 offset on Dec 29. 
	    // Here, we are creating the persona and its pronunciatio sprites.
	    personas[persona_name] = new_sprite;
	    // The physics sprite still does the moving; a peg in the persona's color is drawn on it.
	    new_sprite.setVisible(false);
	    // Depth is set in syncPeg: above the foreground layer so heads aren't cut off, below the bubbles.
	    pegs[persona_name] = this.add.sprite(0, 0, "pegs", pegRow(i, "d") * 3).setOrigin(0.5, 1).setScale(3);
	    syncPeg(persona_name);
	    pronunciatios[persona_name] = speechBubble(this, "🦁");
	    placeBubble(persona_name);
	    noteTile(persona_name, spawn_tile_loc[persona_name][0], spawn_tile_loc[persona_name][1]);
	  }
	  // Under the pegs and bubbles, over the foreground layer.
	  trailGfx = this.add.graphics().setDepth(2.2);

	  // Night layer: above the foreground, below pegs and bubbles; agents only get a cool tint so they stay visible.
	  if (!overview) {
	    // Indoors (interior floors and the wall faces just above them) stays lighter, with a warm cast.
	    // One pixel per tile, scaled up with nearest-pixel filtering: tile-exact edges, no seams between strips.
	    const cols = map.width, rows = map.height;
	    const floor = (x, y) => (interiorGroundLayer.getTileAt(x, y)?.index ?? -1) >= 0;
	    const wall = (x, y) => (wallLayer.getTileAt(x, y)?.index ?? -1) >= 0;
	    const indoor = (x, y) => floor(x, y) || (wall(x, y) && (floor(x, y + 1) || floor(x, y + 2) || floor(x, y + 3)));
	    const hex = (c, a) => `rgba(${c >> 16 & 255},${c >> 8 & 255},${c & 255},${a})`;
	    const outTex = this.textures.createCanvas("night-out", cols, rows), outCtx = outTex.getContext();
	    const inTex = this.textures.createCanvas("night-in", cols, rows), inCtx = inTex.getContext();
	    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
	      if (indoor(x, y)) {
	        inCtx.fillStyle = hex(NIGHT_COLOR, NIGHT_MAX * NIGHT_INDOOR); inCtx.fillRect(x, y, 1, 1);
	        inCtx.fillStyle = hex(NIGHT_WARM, NIGHT_MAX * NIGHT_WARMTH); inCtx.fillRect(x, y, 1, 1);
	      } else { outCtx.fillStyle = hex(NIGHT_COLOR, 1); outCtx.fillRect(x, y, 1, 1); }
	    }
	    outTex.refresh(); inTex.refresh();
	    night.out = this.add.image(0, 0, "night-out").setOrigin(0, 0).setScale(tile_width).setDepth(2.3).setVisible(false);
	    night.inside = this.add.image(0, 0, "night-in").setOrigin(0, 0).setScale(tile_width).setDepth(2.3).setVisible(false);
	    // A soft round light for each awake agent.
	    const glow = this.textures.createCanvas("night-glow", 64, 64), gctx = glow.getContext();
	    const grad = gctx.createRadialGradient(32, 32, 0, 32, 32, 32);
	    grad.addColorStop(0, "rgba(255,226,170,1)"); grad.addColorStop(1, "rgba(255,226,170,0)");
	    gctx.fillStyle = grad; gctx.fillRect(0, 0, 64, 64); glow.refresh();
	    for (const n of Object.keys(personas)) {
	      night.glows[n] = this.add.image(0, 0, "night-glow").setScale(2.5).setDepth(2.35).setBlendMode(Phaser.BlendModes.ADD).setVisible(false);  // a pool of light under them
	    }
	  }

	  // Embedded map navigation: drag to pan, wheel to zoom toward the pointer, click an agent to pick them.
	  if (!overview) {
	    const fitZoom = Math.max(config.width / mapW, config.height / mapH);
	    let drag = null;
	    this.input.on("pointerdown", (p) => { drag = {x: p.x, y: p.y, sx: camera.scrollX, sy: camera.scrollY, moved: false}; });
	    this.input.on("pointermove", (p) => {
	      if (!drag || !p.isDown) return;
	      if (!drag.moved && Math.hypot(p.x - drag.x, p.y - drag.y) < 5) return;
	      if (!drag.moved) { drag.moved = true; camera.stopFollow(); tellDashboard({type: "camera", following: false}); }
	      camera.setScroll(drag.sx - (p.x - drag.x) / camera.zoom, drag.sy - (p.y - drag.y) / camera.zoom);
	    });
	    this.input.on("pointerup", (p) => {
	      if (drag && !drag.moved) {
	        // The nearest agent within about a peg's width of the click, measured to the peg's middle.
	        let best = null, bestD = 48 * 48;
	        for (const n of Object.keys(pegs)) {
	          const g = pegs[n], d = (g.x - p.worldX) ** 2 + (g.y - 36 - p.worldY) ** 2;
	          if (d < bestD) { bestD = d; best = n; }
	        }
	        if (best) tellDashboard({type: "pick", name: best});
	      }
	      drag = null;
	    });
	    this.input.on("wheel", (p, objs, dx, dy) => {
	      const before = camera.getWorldPoint(p.x, p.y);
	      camera.setZoom(Math.max(fitZoom, Math.min(3, camera.zoom * Math.exp(-dy * 0.0015))));
	      camera.preRender();
	      const after = camera.getWorldPoint(p.x, p.y);
	      if (!camera._follow) camera.setScroll(camera.scrollX + before.x - after.x, camera.scrollY + before.y - after.y);
	    });
	  }

	  // Peg walk cycles, one per color and facing.
	  for (let c = 0; c < 8; c++) for (const d of ["d", "l", "r", "u"]) {
	    const row = pegRow(c, d);
	    this.anims.create({key: `peg-${c}-${d}`, frames: this.anims.generateFrameNumbers("pegs", {frames: [row * 3 + 1, row * 3, row * 3 + 2, row * 3]}), frameRate: 8, repeat: -1});
	  }
	}


	function update(time, delta) {
		// *** SETUP PLAY AND PAUSE BUTTON *** 
		let play_context = this;
		function game_resume() {  
			play_context.scene.resume();
		}  
		play_button.onclick = function(){
			game_resume();
		};
		function game_pause() {  
			play_context.scene.pause();
		}  
		pause_button.onclick = function(){
			game_pause();
		};

	  // *** MOVE CAMERA *** 
	  // This is where we finish up the camera setting we started in the create() 
	  // function. We set the movement speed of the camera and wire up the keys to
	  // map to the actual movement.
	  const camera_speed = 400;
	  // Stop any previous movement from the last frame
	  player.body.setVelocity(0);
	  if (cursors.left.isDown) {
	    player.body.setVelocityX(-camera_speed);
	  } 
	  if (cursors.right.isDown) {
	    player.body.setVelocityX(camera_speed);
	  } 
	  if (cursors.up.isDown) {
	    player.body.setVelocityY(-camera_speed);
	  } 
	  if (cursors.down.isDown) {
	    player.body.setVelocityY(camera_speed);
	  }

	  if (overview) return;
	  renderSays(performance.now());
	  if (night.out) {
	    night.level += (night.target - night.level) * Math.min(1, delta / 500);
	    if (night.dirty || Math.abs(night.level - night.drawn) > 0.004) drawNight();
	  }
	  if (replayMode) {
	    if (rp.seekTo != null && phase !== "execute") { step = rp.seekTo; rp.seekTo = null; phase = "update"; timer = 0; rp.waitUntil = 0; }
	    if (rp.paused || time < rp.waitUntil) return;
	  }

	  // console.log("phase: " + phase + ", step: " + step);
	  // *** MOVE PERSONAS ***
	  // Moving personas take place in three distinct phases: "process," "update,"
	  // and "execute." These phases are determined by the value of <phase>. 
	  // Only one of the three phases is incurred in each update cycle. 
	  if (phase == "process") {
	    // "process" takes all current locations of the personas and send them to
	    // the frontend server in a json form. Here, we first create the json 
	    // file that records all persona locations: 
	    let data = {"step": step, 
	    						"sim_code": sim_code,
	                "environment": {}}
	    for (let i=0; i<Object.keys(personas).length; i++) {
	      let persona_name = Object.keys(personas)[i];
	      data["environment"][persona_name] = {"maze": curr_maze,
	                                           "x": Math.ceil((personas[persona_name].body.position.x) / tile_width),
	                                           "y": Math.ceil((personas[persona_name].body.position.y) / tile_width)}
	    }
	    var json = JSON.stringify(data);
	    // We then send this to the frontend server: 
	    var retrieve_xobj = new XMLHttpRequest();
	    retrieve_xobj.overrideMimeType("application/json");
	    retrieve_xobj.open('POST', "{% url 'process_environment' %}", true);
	    retrieve_xobj.send(json);   
	    // Finally, we update the phase variable to start the "udpate" process. 
	    // Now that we sent all persona locations to the backend server, we need
	    // to wait until the backend determines what the personas will do next. 
	    phase = "update";
	  } 

	  else if (phase == "update") { 
	    // Update is where we * wait * for the backend server to finish 
	    // computing about what the personas will do next given their current 
	    // situation. 
	    // We do this by continuously asking the backend server if it is ready. 
	    // The backend server is ready when it returns a json that has a key-val
	    // pair with "<move>": true.
	    // Note that we do not want to overburden the backend too much by 
	    // over-querying; so, we have a timer set so we only query it once every
	    // timer_max cycles. 
	    if (timer <= 0 && !update_pending) {
	      update_pending = true;
	      var update_xobj = new XMLHttpRequest();
	      update_xobj.overrideMimeType("application/json");
	      update_xobj.open('POST', "{% url 'update_environment' %}", true);
	      update_xobj.addEventListener("loadend", function() { update_pending = false; });
	      update_xobj.addEventListener("load", function() {
	        if (this.readyState === 4) {
	          if (update_xobj.status === 200) {
	            if (JSON.parse(update_xobj.responseText)["<step>"] == step) {
	              execute_movement = JSON.parse(update_xobj.responseText)
	              phase = "execute";
	            } else if (replayMode) {
	              // Past the last saved step: ask again on a slow timer, not every frame.
	              rp.waitUntil = performance.now() + 1000;
	              tellDashboard({type: "replay-end", step: step});
	            }
	            timer = timer_max;
	          }
	        }
	      });
	      update_xobj.send(JSON.stringify({"step": step, "sim_code": sim_code }));   
	    }
	    timer = timer - 1; 
	  } 

	  else { 
	    // This is where we actually move the personas in the visual world. Each
	    // backend computation in execute_movement moves each persona by one tile
	    // (or some personas might not move if they choose not to). 
	    // The execute_count_max is computed by tile_width/movement_speed, which
	    // defines a one step sequence in this world. 
	    document.getElementById("game-time-content").innerHTML = execute_movement["meta"]["curr_time"];
	    if (execute_count == execute_count_max) {
	      noteSays(execute_movement, step, marksStep);
	      marksStep = step;
	      setNightTime(execute_movement["meta"]["curr_time"]);
	      // Asleep as the stance probe counts it, written by reverie.py; runs without it fall back to a guess from the activity.
	      for (const n of Object.keys(execute_movement["persona"])) {
	        const p = execute_movement["persona"][n];
	        night.awake[n] = typeof p["asleep"] === "boolean" ? !p["asleep"] : !/sleep/i.test(p["description"] || "");
	      }
	    }
	    night.dirty = true;
	    for (let i=0; i<Object.keys(personas).length; i++) {
	      let curr_persona_name = Object.keys(personas)[i];
	      let curr_persona = personas[curr_persona_name];

	      if (execute_count == execute_count_max) { 
	        let curr_x = execute_movement["persona"][curr_persona_name]["movement"][0];
	        let curr_y = execute_movement["persona"][curr_persona_name]["movement"][1];
	        movement_target[curr_persona_name] = [curr_x * tile_width, 
	                                              curr_y * tile_width]; 
	        step_moved[curr_persona_name] = curr_persona.body.x !== curr_x * tile_width || curr_persona.body.y !== curr_y * tile_width;
	        noteTile(curr_persona_name, curr_x, curr_y);
	        if (curr_persona_name === trailName) drawTrail();
	      }

	      console.log(curr_persona_name);
	      if (execute_count > 0) {
	        if (curr_persona.body.x < movement_target[curr_persona_name][0]) {
	          curr_persona.body.x += movement_speed; 
	          anims_direction = "r";
	          pre_anims_direction = "r"
	          pre_anims_direction_dict[curr_persona_name] = "r"
	        } else if (curr_persona.body.x > movement_target[curr_persona_name][0]) {
	          curr_persona.body.x -= movement_speed; 
	          anims_direction = "l";
	          pre_anims_direction = "l"
	          pre_anims_direction_dict[curr_persona_name] = "l"
	        } else if (curr_persona.body.y < movement_target[curr_persona_name][1]) {
	          curr_persona.body.y += movement_speed;
	          anims_direction = "d";
	          pre_anims_direction = "d"
	          pre_anims_direction_dict[curr_persona_name] = "d"
	        } else if (curr_persona.body.y > movement_target[curr_persona_name][1]) {
	          curr_persona.body.y -= movement_speed;
	          anims_direction = "u";
	          pre_anims_direction = "u"
	          pre_anims_direction_dict[curr_persona_name] = "u"
	        } else {
	        	anims_direction = "";
	        }

	        syncPeg(curr_persona_name);
        placeBubble(curr_persona_name);

          const peg = pegs[curr_persona_name], ci = pegIndex(curr_persona_name);
          if (anims_direction && night.awake[curr_persona_name] !== false) {
            peg.anims.play(`peg-${ci % 8}-${anims_direction}`, true);
          } else if (!step_moved[curr_persona_name] || night.awake[curr_persona_name] === false) {  // asleep: never walking in place
            // Standing: the idle frame facing the last way it walked.
            peg.anims.stop();
            peg.setFrame(pegRow(ci, pre_anims_direction_dict[curr_persona_name]) * 3);
          };

	      } 
	      else {
	        // Once we are done moving the personas, we move on to the "process"
	        // stage where we will send the current locations of all personas at the
	        // end of the movemments to the frontend server, and then the backend.
	        for (let i=0; i<Object.keys(personas).length; i++) {
	          let curr_persona_name = Object.keys(personas)[i]
	          let curr_persona = personas[curr_persona_name];
	          curr_persona.body.x = movement_target[curr_persona_name][0];
	          curr_persona.body.y = movement_target[curr_persona_name][1];
	          syncPeg(curr_persona_name);
	          placeBubble(curr_persona_name);
	        }
	        if (replayMode) tellDashboard({type: "replay-step", step: step, time: execute_movement["meta"]["curr_time"]});
	        phase = replayMode ? "update" : "process";
	        execute_count = execute_count_max + 1;
	        step = step + (replayMode ? rp.stride : 1);
	      }
	    }

	    // Filling in the action description. 
	    if (execute_count == execute_count_max) { 
	      for (let i=0; i<Object.keys(personas).length; i++) {
	      	let action_description = ""
	        let curr_persona_name = Object.keys(personas)[i];
	        let curr_persona_name_os = curr_persona_name.replace(/ /g,"_");
	        let description_content = execute_movement["persona"][curr_persona_name]["description"];
	        let chat_content = ""

	        if (execute_movement["persona"][curr_persona_name]["chat"] != null ){
		        for (let j=0; j<execute_movement["persona"][curr_persona_name]["chat"].length; j++) { 
		        	chat_content += execute_movement["persona"][curr_persona_name]["chat"][j][0] + ": " + execute_movement["persona"][curr_persona_name]["chat"][j][1] + "<br>"
		        }
		      } else {
		      	chat_content = "<em>None at the moment</em>"
		      }
	        // action_description += description_content + "<br>";

	        document.getElementById("current_action__"+curr_persona_name_os).innerHTML = description_content.split("@")[0];
	        document.getElementById("target_address__"+curr_persona_name_os).innerHTML = description_content.split("@")[1];
	        document.getElementById("chat__"+curr_persona_name_os).innerHTML = chat_content;
	      }
	      
	    }

	    execute_count = execute_count - 1;
	  }
	}

	// Control button binders
	var play_button=document.getElementById("play_button");
	var pause_button=document.getElementById("pause_button");

	// Space inside the map pauses or resumes a replay; the dashboard owns the play state.
	window.addEventListener("keydown", (e) => {
	  if (replayMode && e.code === "Space") { e.preventDefault(); tellDashboard({type: "space"}); }
	}, true);
	// Commands posted by the dashboard.
	window.addEventListener("message", function(e) {
	  if (overview || e.origin !== window.location.origin || !e.data || !camera) return;
	  // The game time before the first step arrives, so a run loaded at night doesn't open in daylight.
	  if (e.data.type === "clock") {
	    if (night.hour == null && Number.isFinite(e.data.hour)) { night.hour = e.data.hour; setNightTime(null); night.level = night.target; night.dirty = true; }
	    return;
	  }
	  if (e.data.type === "marks") { marks = Array.isArray(e.data.items) ? e.data.items : []; return; }
	  if (e.data.type === "night") { night.enabled = !!e.data.on; setNightTime(null); return; }
	  if (e.data.type === "replay" && replayMode) {
	    if (e.data.cmd === "pause") rp.paused = true;
	    if (e.data.cmd === "play") rp.paused = false;
	    if (e.data.cmd === "speed") rp.stride = Math.max(1, parseInt(e.data.value, 10) || 1);
	    if (e.data.cmd === "seek") { rp.seekTo = Math.max(0, parseInt(e.data.value, 10) || 0); tileTrail = {}; drawTrail(); marksStep = null; }  // a jump isn't a walk
	    return;
	  }
	  if (e.data.type === "overview") {
	    // Fill the frame with the town. Sits a bit above center so the top row
	    // of houses shows; only forest is trimmed at the bottom.
	    camera.stopFollow();
	    trailName = null;
	    drawTrail();
	    camera.setZoom(Math.max(config.width / mapW, config.height / mapH));
	    camera.centerOn(mapW / 2, mapH / 2 - 150);
	  } else if (e.data.type === "focus") {
	    let target = personas[e.data.name];
	    if (!target || !player) return;
	    player.setPosition(target.body.x, target.body.y);
	    camera.setZoom(1);
	    // A replay follows the agent itself, so seeking and fast playback keep them in view.
	    camera.startFollow(replayMode ? target : player);
	    trailName = e.data.name;
	    trailColor = parseInt(String(e.data.color || "#000000").replace("#", ""), 16) || 0;
	    drawTrail();
	  }
	});
</script>
